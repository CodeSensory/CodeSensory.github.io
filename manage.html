<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리 필요</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>

<body>
  <div class="page-shell">
    <header class="site-header">
      <a href="view.html" id="logo-link" class="logo-link">
        <div class="logo">
          <img src="https://www.kangwon.ac.kr/assets/ko/images/logos/logo-color.webp" alt="강원대학교" />
          <span class="label-status campus" style="color:white;background:#F1B337" aria-label="원주">원주</span>
          <strong>간호학과 성적 관리</strong>
        </div>
      </a>
      <nav class="global-nav"></nav>
    </header>

    <section class="hero">
      <div class="hero-content">
        <h1 class="page-main-title">관리 학생 파악</h1>
        <p class="page-description">달성도 미달 학생을 확인할 수 있습니다.</p>
      </div>
    </section>

    <main class="content-grid">
      <section class="panel filter-panel">
        <div class="filter-section">
          <h3 class="section-title">필터 설정</h3>
          <div class="form-row">
            <label class="form-label">
              <span class="label-text">학번 앞 4자리</span>
              <select id="manage-student-id-prefix" name="studentIdPrefix" class="form-select">
                <option value="">전체</option>
              </select>
            </label>
          </div>
        </div>
      </section>

      <section class="panel achievement-panel">
        <div class="panel-header">
          <h2 class="panel-title">달성도 '하'가 있는 학생</h2>
          <label class="form-label-inline">
            <span class="label-text">레벨 선택</span>
            <select id="low-level-select" name="lowLevel" class="form-select-small">
              <option value="l1">L1</option>
              <option value="l2">L2</option>
              <option value="l3">L3</option>
            </select>
          </label>
        </div>
        <div class="status" id="low-status"></div>
        <div class="table-container">
          <table id="low-achievement-table" class="achievement-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section class="panel achievement-panel">
        <div class="panel-header">
          <h2 class="panel-title">달성도 '중'이 있는 학생</h2>
          <label class="form-label-inline">
            <span class="label-text">레벨 선택</span>
            <select id="mid-level-select" name="midLevel" class="form-select-small">
              <option value="l1">L1</option>
              <option value="l2">L2</option>
              <option value="l3">L3</option>
            </select>
          </label>
        </div>
        <div class="status" id="mid-status"></div>
        <div class="table-container">
          <table id="mid-achievement-table" class="achievement-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      © 강원대학교 간호학과 - 학사행정 전용 도구</br>문의: codesensory@gmail.com
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="js/db-utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/manage.js"></script>
  <script src="js/nav.js"></script>
</body>

</html>
