<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>학생 성적 조회</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>

<body>
  <div class="page-shell">
    <header class="site-header">
      <a href="view.html" id="logo-link" class="logo-link">
        <div class="logo">
          <img src="https://www.kangwon.ac.kr/assets/ko/images/logos/logo-color.webp" alt="강원대학교" />
          <span class="label-status campus" style="color:white;background:#F1B337" aria-label="원주">원주</span>
          <strong>간호학과 성적 관리</strong>
        </div>
      </a>
      <nav class="global-nav"></nav>
    </header>

    <section class="hero">
      <div class="hero-content">
        <h1 class="page-main-title">성적 현황</h1>
        <p class="page-description">데이터베이스 내 학생들의 점수를 확인할 수 있습니다.</p>
      </div>
    </section>

    <main class="content-grid">
      <section class="panel">
        <div class="toolbar">
          <input type="text" id="search-student" placeholder="학번 또는 이름으로 검색" />
          <button class="primary" id="search-btn" type="button">검색</button>
          <button class="secondary" id="refresh-btn" type="button">새로고침</button>
        </div>
        <div class="status" id="view-status"></div>
        
        <!-- 검색 결과 테이블 -->
        <div class="table-container" id="search-result-container" style="max-height:60vh; display: none; margin-bottom: 16px;">
          <table id="search-result-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
        
        <!-- 수정 폼 섹션 -->
        <section class="panel" id="edit-form-section" style="display: none; margin-top: 24px; background: var(--bg-secondary); border-radius: 12px; padding: 24px;">
          <h2 style="margin-top: 0; margin-bottom: 20px; color: var(--knu-blue);">성적 수정</h2>
          <form id="edit-grade-form">
            <div style="background: var(--bg-primary); padding: 16px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--border-color);">
              <label style="display: flex; align-items: center; gap: 12px; margin-bottom: 8px;">
                <span style="font-weight: 600; min-width: 60px;">학번</span>
                <input type="text" id="edit-student-id" readonly style="flex: 1; max-width: 200px;" />
              </label>
              <label style="display: flex; align-items: center; gap: 12px; margin-bottom: 0;">
                <span style="font-weight: 600; min-width: 60px;">이름</span>
                <input type="text" id="edit-student-name" maxlength="100" placeholder="이름" style="flex: 1; max-width: 200px;" />
              </label>
            </div>
            
            <div style="background: var(--bg-primary); padding: 16px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--border-color);">
              <h3 style="margin-top: 0; margin-bottom: 16px; font-size: 16px; color: var(--text-primary);">과목별 성적</h3>
              <div class="table-container" style="max-height: 400px; overflow-y: auto;">
                <table id="edit-subjects-table" style="margin: 0;">
                  <thead>
                    <tr>
                      <th style="width: 80px;">과목</th>
                      <th style="width: 120px;">점수</th>
                      <th style="width: 120px;">달성도</th>
                    </tr>
                  </thead>
                  <tbody id="edit-subjects-tbody"></tbody>
                </table>
              </div>
            </div>
            
            <div style="background: var(--bg-primary); padding: 16px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--border-color);">
              <label style="display: flex; flex-direction: column; gap: 8px;">
                <span style="font-weight: 600;">비고</span>
                <textarea id="edit-note" rows="3" placeholder="기타 내용을 입력하세요" style="width: 100%; padding: 10px; font-family: inherit; font-size: 14px; border: 1px solid var(--border-color); border-radius: 6px; resize: vertical;"></textarea>
              </label>
            </div>
            
            <div class="toolbar" style="justify-content: flex-end; margin-top: 24px;">
              <button class="secondary" type="button" id="cancel-edit-btn">취소</button>
              <button class="primary" type="submit">수정 저장</button>
            </div>
            <div class="status" id="edit-status" style="margin-top: 12px;"></div>
          </form>
        </section>
        
        <div class="subject-checkbox-controls">
          <button class="secondary" id="select-all-btn" type="button">전체 선택</button>
          <button class="secondary" id="deselect-all-btn" type="button">전체 해제</button>
          <label style="margin-left: 16px; display: flex; align-items: center; gap: 8px;">
            레벨 선택:
            <select id="level-select" name="level" style="width: 100px;">
              <option value="l1">L1</option>
              <option value="l2">L2</option>
              <option value="l3">L3</option>
            </select>
          </label>
        </div>
        <div class="subject-checkboxes" id="subject-checkboxes"></div>
        
        <div class="table-container" style="max-height:60vh;">
          <table id="grades-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      © 강원대학교 간호학과 - 학사행정 전용 도구</br>문의: codesensory@gmail.com
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="js/db-utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/view.js"></script>
  <script src="js/nav.js"></script>
</body>

</html>
