<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>CodeSensory Lab</title>
    <script>
      var PATH_SEGMENTS_TO_KEEP = 0
      var locationRef = window.location
      locationRef.replace(
        locationRef.protocol +
          '//' +
          locationRef.hostname +
          (locationRef.port ? ':' + locationRef.port : '') +
          locationRef.pathname.split('/').slice(0, 1 + PATH_SEGMENTS_TO_KEEP).join('/') +
          '/?/' +
          locationRef.pathname
            .slice(1)
            .split('/')
            .slice(PATH_SEGMENTS_TO_KEEP)
            .join('/')
            .replace(/&/g, '~and~') +
          (locationRef.search ? '&' + locationRef.search.slice(1).replace(/&/g, '~and~') : '') +
          locationRef.hash,
      )
    </script>
  </head>
  <body></body>
</html>
