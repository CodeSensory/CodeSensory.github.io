<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>성적 업로드 미리보기</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>

<body>
  <div class="page-shell">
    <header class="site-header">
      <a href="view.html" id="logo-link" class="logo-link">
        <div class="logo">
          <img src="https://www.kangwon.ac.kr/assets/ko/images/logos/logo-color.webp" alt="강원대학교" />
          <span class="label-status campus" style="color:white;background:#F1B337" aria-label="원주">원주</span>
          <strong>간호학과 성적 관리</strong>
        </div>
      </a>
      <nav class="global-nav"></nav>
    </header>

    <section class="hero">
      <div class="hero-content">
        <h1 class="page-main-title">입력 성적 확인</h1>
        <p class="page-description">엑셀 파일에서 읽어온 데이터를 확인하고, DB에 저장합니다.</p>
      </div>
    </section>

    <main class="content-grid">
      <!-- 기준점 설정 섹션 -->
      <section class="panel" id="criteria-panel">
        <h2 style="margin-top: 0;">달성도 기준점 설정</h2>
        <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 16px;">
          각 과목별로 상/중 기준점과 중/하 기준점을 입력하세요. 입력된 점수에 따라 달성도가 자동으로 계산됩니다.
        </p>
        <div class="table-container" style="max-height: 40vh; overflow-y: auto;">
          <table id="criteria-table">
            <thead>
              <tr>
                <th>과목</th>
                <th>상/중 기준점<br/>(이상이면 상)</th>
                <th>중/하 기준점<br/>(이상이면 중)</th>
                <th>적용</th>
              </tr>
            </thead>
            <tbody id="criteria-tbody"></tbody>
          </table>
        </div>
        <div class="toolbar" style="margin-top: 16px;">
          <button class="primary" id="apply-criteria-btn" type="button">모든 기준점 적용 및 달성도 계산</button>
        </div>
        <div class="status" id="criteria-status"></div>
      </section>
      
      <section class="panel">
        <div class="toolbar">
          <button class="secondary" id="back-btn" type="button">← 돌아가기</button>
          <button class="primary" id="save-btn" type="button">DB에 저장</button>
        </div>
        <div class="status" id="preview-status"></div>
        <div class="table-container" style="max-height:60vh;">
          <table id="preview-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
        
        <!-- 수정 폼 -->
        <section class="panel" id="edit-form-panel" style="display: none; margin-top: 16px;">
          <h2>데이터 수정</h2>
          <form id="edit-preview-form">
            <label>
              학번
              <input type="text" id="edit-student-id" readonly />
            </label>
            <div class="table-container" style="max-height: 50vh; overflow-y: auto; margin-top: 16px;">
              <table>
                <thead>
                  <tr>
                    <th>과목</th>
                    <th>점수</th>
                    <th>달성도</th>
                  </tr>
                </thead>
                <tbody id="edit-subjects-tbody">
                </tbody>
              </table>
            </div>
            <div class="toolbar" style="margin-top: 16px;">
              <button class="primary" type="submit">수정 저장</button>
              <button class="secondary" type="button" id="cancel-edit-btn">취소</button>
            </div>
            <div class="status" id="edit-status"></div>
          </form>
        </section>
      </section>
    </main>

    <footer class="site-footer">
      © 강원대학교 간호학과 - 학사행정 전용 도구</br>문의: codesensory@gmail.com
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="js/db-utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/nav.js"></script>
</body>

</html>
