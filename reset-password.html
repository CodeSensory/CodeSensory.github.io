<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>비밀번호 재설정 - 간호학과 성적 관리</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>

<body>
  <div class="page-shell">
    <header class="site-header auth-header">
      <a href="login.html" id="logo-link" class="logo-link">
        <div class="logo">
          <img src="https://www.kangwon.ac.kr/assets/ko/images/logos/logo-color.webp" alt="강원대학교" />
          <span class="label-status campus" style="color:white;background:#F1B337" aria-label="원주">원주</span>
          <strong>간호학과 성적 관리</strong>
        </div>
      </a>
    </header>

    <section class="hero">
      <div class="hero-content">
        <h1 class="page-main-title">비밀번호 재설정</h1>
        <p class="page-description">가입 시 사용한 이메일을 입력하세요. 관리자 승인된 경우에만 새 비밀번호를 설정할 수 있습니다.</p>
      </div>
    </section>

    <main class="content-grid">
      <section class="panel auth-panel">
        <form id="reset-password-form" class="auth-form">
          <label>
            이메일
            <input type="email" id="reset-password-email" name="email" required autocomplete="email" placeholder="example@email.com" />
          </label>
          <div class="auth-form-actions">
            <button type="submit" class="primary">확인</button>
          </div>
        </form>
        <div class="auth-links">
          <a href="login.html">로그인</a>
          <a href="reset-request.html">비밀번호 초기화 요청</a>
        </div>
        <div class="status" id="reset-password-status"></div>
      </section>
    </main>

    <footer class="site-footer">
      © 강원대학교 간호학과 - 학사행정 전용 도구
    </footer>
  </div>

  <!-- 새 비밀번호 입력 모달 -->
  <div id="new-password-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content" style="max-width: 400px;">
      <h3 style="margin-top: 0;">새 비밀번호 입력</h3>
      <form id="new-password-form" class="auth-form">
        <label>
          새 비밀번호
          <input type="password" id="new-password" required minlength="6" placeholder="6자 이상" />
        </label>
        <label>
          새 비밀번호 확인
          <input type="password" id="new-password-confirm" required minlength="6" placeholder="다시 입력" />
        </label>
        <div class="toolbar" style="margin-top: 16px; justify-content: flex-end; gap: 8px;">
          <button type="button" class="secondary" id="modal-cancel-btn">취소</button>
          <button type="submit" class="primary">변경하기</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="config.js"></script>
  <script src="js/db-utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notify-request.js"></script>
  <script src="js/reset-password.js"></script>
</body>

</html>
