<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>재시험 성적 입력</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>

<body>
  <div class="page-shell">
    <header class="site-header">
      <a href="view.html" id="logo-link" class="logo-link">
        <div class="logo">
          <img src="https://www.kangwon.ac.kr/assets/ko/images/logos/logo-color.webp" alt="강원대학교" />
          <span class="label-status campus" style="color:white;background:#F1B337" aria-label="원주">원주</span>
          <strong>간호학과 성적 관리</strong>
        </div>
      </a>
      <nav class="global-nav"></nav>
    </header>

    <section class="hero">
      <div class="hero-content">
        <h1 class="page-main-title">재시험 성적 입력</h1>
        <p class="page-description" style="white-space: nowrap;">학번 또는 이름을 입력한 뒤, 해당 학생이 있을 경우에만 레벨별 핵심술기 과목의 점수와 성취도를 수정할 수 있습니다.</p>
      </div>
    </section>

    <main class="content-grid">
      <section class="panel">
        <div class="toolbar">
          <input type="text" id="retake-search-student" placeholder="학번 또는 이름 입력" />
          <button class="primary" id="retake-search-btn" type="button">검색</button>
        </div>
        <div class="status" id="retake-status"></div>

        <!-- 학생이 있을 때만 표시: 레벨별 성적 테이블 -->
        <div id="retake-result-section" style="display: none; margin-top: 24px;">
          <div style="margin-bottom: 16px;">
            <strong id="retake-student-id-label"></strong> 학생의 핵심술기 과목 성적입니다. 수정할 과목을 클릭하세요.
          </div>
          <div class="retake-level-panels">
            <section class="panel" style="margin-bottom: 24px; border: 1px solid var(--border-color);">
              <h2 style="font-size: 18px; margin-bottom: 12px;">L1</h2>
              <div class="table-container" style="max-height: 50vh;">
                <table class="retake-subjects-table" data-level="l1">
                  <thead>
                    <tr>
                      <th>과목</th>
                      <th>점수</th>
                      <th>성취도</th>
                    </tr>
                  </thead>
                  <tbody id="retake-tbody-l1"></tbody>
                </table>
              </div>
            </section>
            <section class="panel" style="margin-bottom: 24px; border: 1px solid var(--border-color);">
              <h2 style="font-size: 18px; margin-bottom: 12px;">L2</h2>
              <div class="table-container" style="max-height: 50vh;">
                <table class="retake-subjects-table" data-level="l2">
                  <thead>
                    <tr>
                      <th>과목</th>
                      <th>점수</th>
                      <th>성취도</th>
                    </tr>
                  </thead>
                  <tbody id="retake-tbody-l2"></tbody>
                </table>
              </div>
            </section>
            <section class="panel" style="margin-bottom: 24px; border: 1px solid var(--border-color);">
              <h2 style="font-size: 18px; margin-bottom: 12px;">L3</h2>
              <div class="table-container" style="max-height: 50vh;">
                <table class="retake-subjects-table" data-level="l3">
                  <thead>
                    <tr>
                      <th>과목</th>
                      <th>점수</th>
                      <th>성취도</th>
                    </tr>
                  </thead>
                  <tbody id="retake-tbody-l3"></tbody>
                </table>
              </div>
            </section>
          </div>
        </div>
      </section>
    </main>

    <!-- 이름 검색 시 중복 학생 선택 모달 -->
    <div id="retake-select-student-modal" class="modal-overlay" style="display: none;">
      <div class="modal-content" style="max-width: 400px;">
        <h3 style="margin-top: 0; margin-bottom: 16px;">동일한 이름의 학생이 여러 명 있습니다</h3>
        <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 16px;">수정할 학생을 선택하세요.</p>
        <ul id="retake-select-student-list" style="list-style: none; padding: 0; margin: 0; max-height: 300px; overflow-y: auto;"></ul>
        <div style="margin-top: 16px;">
          <button type="button" class="secondary" id="retake-select-student-cancel">취소</button>
        </div>
      </div>
    </div>

    <!-- 재시험 입력 모달 -->
    <div id="retake-modal" class="modal-overlay" style="display: none;">
      <div class="modal-content" style="max-width: 420px;">
        <h3 style="margin-top: 0; margin-bottom: 16px;">재시험 성적 입력</h3>
        <form id="retake-edit-form">
          <input type="hidden" id="retake-modal-level" />
          <input type="hidden" id="retake-modal-subject-index" />
          <div style="margin-bottom: 12px;">
            <label style="display: block; margin-bottom: 4px; font-weight: 600;">수강 년도</label>
            <input type="number" id="retake-modal-year" min="2000" max="2100" placeholder="예: 2024" style="width: 100%; padding: 8px;" />
          </div>
          <div style="margin-bottom: 12px;">
            <label style="display: block; margin-bottom: 4px; font-weight: 600;">수강 과목</label>
            <input type="text" id="retake-modal-subject-name" placeholder="과목명 입력" style="width: 100%; padding: 8px;" />
          </div>
          <div style="margin-bottom: 12px;">
            <label style="display: block; margin-bottom: 4px; font-weight: 600;">점수</label>
            <input type="number" id="retake-modal-score" min="0" max="100" step="0.1" placeholder="0–100" style="width: 100%; padding: 8px;" />
          </div>
          <div style="margin-bottom: 16px;">
            <label style="display: block; margin-bottom: 4px; font-weight: 600;">성취도</label>
            <select id="retake-modal-achievement" style="width: 100%; padding: 8px;">
              <option value="">선택 안 함</option>
              <option value="상">상</option>
              <option value="중">중</option>
              <option value="하">하</option>
            </select>
          </div>
          <div class="toolbar" style="justify-content: flex-end; gap: 8px;">
            <button type="button" class="secondary" id="retake-modal-cancel">취소</button>
            <button type="submit" class="primary">저장</button>
          </div>
        </form>
        <div class="status" id="retake-modal-status" style="margin-top: 12px;"></div>
      </div>
    </div>

    <footer class="site-footer">
      © 강원대학교 간호학과 - 학사행정 전용 도구</br>문의: codesensory@gmail.com
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="js/db-utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/retake.js"></script>
  <script src="js/nav.js"></script>
</body>

</html>
