<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 - 간호학과 성적 관리</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.2/dist/umd/supabase.js"></script>
</head>

<body>
  <div class="page-shell">
    <header class="site-header auth-header">
      <a href="login.html" id="logo-link" class="logo-link">
        <div class="logo">
          <span>국립강릉원주대학교</span>
          <strong>간호학과 성적 관리</strong>
        </div>
      </a>
    </header>

    <section class="hero">
      <div class="hero-content">
        <p class="hero-kicker">SIGN IN</p>
        <h1>로그인</h1>
        <p>아이디와 비밀번호를 입력하세요.</p>
      </div>
    </section>

    <main class="content-grid">
      <section class="panel auth-panel">
        <form id="login-form" class="auth-form">
          <label>
            아이디
            <input type="text" id="login-username" name="username" required autocomplete="username" placeholder="아이디 입력" />
          </label>
          <label>
            비밀번호
            <input type="password" id="login-password" name="password" required autocomplete="current-password" placeholder="비밀번호 입력" />
          </label>
          <div class="auth-form-actions">
            <button type="submit" class="primary">로그인</button>
          </div>
        </form>
        <div class="auth-links">
          <a href="signup.html">회원가입</a>
          <a href="reset-request.html">비밀번호 초기화 요청</a>
          <a href="reset-password.html">비밀번호 재설정</a>
        </div>
        <div class="status" id="login-status"></div>
      </section>
    </main>

    <footer class="site-footer">
      © 국립강릉원주대학교 간호학과 – 학사행정 전용 도구
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>

</html>
