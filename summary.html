<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>성적 요약</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>

<body>
  <div class="page-shell">
    <header class="site-header">
      <a href="view.html" id="logo-link" class="logo-link">
        <div class="logo">
          <img src="https://www.kangwon.ac.kr/assets/ko/images/logos/logo-color.webp" alt="강원대학교" />
          <span class="label-status campus" style="color:white;background:#F1B337" aria-label="원주">원주</span>
          <strong>간호학과 성적 관리</strong>
        </div>
      </a>
      <nav class="global-nav"></nav>
    </header>

    <section class="hero">
      <div class="hero-content">
        <h1 class="page-main-title">성적 통계 요약</h1>
        <p class="page-description">졸업 연도별로 학생들의 성적 분포를 확인할 수 있습니다.</p>
      </div>
    </section>

    <main class="content-grid">
      <section class="panel">
        <div class="toolbar" style="margin-bottom: 16px;">
          <label style="display: flex; align-items: center; gap: 8px;">
            졸업 연도 선택:
            <select id="graduate-year-select" name="graduateYear" style="width: 150px;">
              <option value="">전체</option>
            </select>
          </label>
          <button class="secondary" id="refresh-btn" type="button">새로고침</button>
        </div>
        <div class="status" id="summary-status"></div>
      </section>

      <section class="panel">
        <h2 style="font-size: 18px; margin-bottom: 12px;">L1 레벨 통계</h2>
        <div class="status" id="l1-status"></div>
        <div class="table-container" style="max-height:50vh;">
          <table id="l1-summary-table">
            <thead>
              <tr>
                <th>단계</th>
                <th>과목명</th>
                <th>과목</th>
                <th>연도</th>
                <th>상</th>
                <th>중</th>
                <th>하</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <h2 style="font-size: 18px; margin-bottom: 12px;">L2 레벨 통계</h2>
        <div class="status" id="l2-status"></div>
        <div class="table-container" style="max-height:50vh;">
          <table id="l2-summary-table">
            <thead>
              <tr>
                <th>단계</th>
                <th>과목명</th>
                <th>과목</th>
                <th>연도</th>
                <th>상</th>
                <th>중</th>
                <th>하</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <h2 style="font-size: 18px; margin-bottom: 12px;">L3 레벨 통계</h2>
        <div class="status" id="l3-status"></div>
        <div class="table-container" style="max-height:50vh;">
          <table id="l3-summary-table">
            <thead>
              <tr>
                <th>단계</th>
                <th>과목명</th>
                <th>과목</th>
                <th>연도</th>
                <th>상</th>
                <th>중</th>
                <th>하</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>

    <!-- 상/중/하 클릭 시 학번 목록 팝업 -->
    <div id="summary-student-modal" class="modal-overlay" style="display: none;">
      <div class="modal-content" style="max-width: 400px;">
        <h3 id="summary-modal-title" style="margin-top: 0; margin-bottom: 12px;">학번 목록</h3>
        <ul id="summary-modal-list" style="list-style: none; padding: 0; margin: 0; max-height: 300px; overflow-y: auto;"></ul>
        <div style="margin-top: 16px;">
          <button type="button" class="secondary" id="summary-modal-close">닫기</button>
        </div>
      </div>
    </div>

    <footer class="site-footer">
      © 강원대학교 간호학과 - 학사행정 전용 도구</br>문의: codesensory@gmail.com
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="js/db-utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/summary.js"></script>
  <script src="js/nav.js"></script>
</body>

</html>
