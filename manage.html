<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리 필요</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.2/dist/umd/supabase.js"></script>
</head>

<body>
  <div class="page-shell">
    <header class="site-header">
      <div class="logo">
        <span>국립강릉원주대학교</span>
        <strong>간호학과 성적 관리</strong>
      </div>
      <nav class="global-nav">
        <a href="input.html">성적 입력/관리</a>
        <a href="view.html">성적 조회</a>
        <a href="summary.html">성적 요약</a>
        <a class="is-active" href="manage.html">관리 필요</a>
        <a href="board.html">게시판</a>
      </nav>
    </header>

    <section class="hero">
      <div class="hero-content">
        <p class="hero-kicker">MANAGEMENT REQUIRED</p>
        <h1>관리 학생 파악</h1>
        <p>달성도 미달 학생을 확인할 수 있습니다.</p>
      </div>
      <div class="hero-meta">
        <h3>관리 기준</h3>
        <ul>
          <li>달성도 '하'가 있는 학생</li>
          <li>달성도 '중'이 있는 학생</li>
        </ul>
      </div>
    </section>

    <main class="content-grid">
      <section class="panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <h2 style="font-size: 18px; margin: 0;">달성도 '하'가 있는 학생</h2>
          <label style="display: flex; align-items: center; gap: 8px;">
            레벨 선택:
            <select id="low-level-select" name="lowLevel" style="width: 100px;">
              <option value="l1">L1</option>
              <option value="l2">L2</option>
              <option value="l3">L3</option>
            </select>
          </label>
        </div>
        <div class="status" id="low-status"></div>
        <div class="table-container" style="max-height:50vh;">
          <table id="low-achievement-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <h2 style="font-size: 18px; margin: 0;">달성도 '중'이 있는 학생</h2>
          <label style="display: flex; align-items: center; gap: 8px;">
            레벨 선택:
            <select id="mid-level-select" name="midLevel" style="width: 100px;">
              <option value="l1">L1</option>
              <option value="l2">L2</option>
              <option value="l3">L3</option>
            </select>
          </label>
        </div>
        <div class="status" id="mid-status"></div>
        <div class="table-container" style="max-height:50vh;">
          <table id="mid-achievement-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      © 국립강릉원주대학교 간호학과 – 학사행정 전용 도구</br>문의: codesensory@gmail.com
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="js/manage.js"></script>
</body>

</html>
