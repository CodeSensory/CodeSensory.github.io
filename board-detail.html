<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>게시글 상세</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.2/dist/umd/supabase.js"></script>
</head>

<body>
  <div class="page-shell">
    <header class="site-header">
      <div class="logo">
        <span>국립강릉원주대학교</span>
        <strong>간호학과 성적 관리</strong>
      </div>
      <nav class="global-nav">
        <a href="input.html">성적 입력/관리</a>
        <a href="view.html">성적 조회</a>
        <a href="summary.html">성적 요약</a>
        <a href="manage.html">관리 필요</a>
        <a href="board.html">게시판</a>
      </nav>
    </header>

    <section class="hero">
      <div class="hero-content">
        <p class="hero-kicker">POST DETAIL</p>
        <h1>게시글 상세</h1>
        <p>게시글의 상세 내용을 확인할 수 있습니다.</p>
      </div>
    </section>

    <main class="content-grid">
      <section class="panel">
        <div class="toolbar" style="margin-bottom: 16px;">
          <button class="secondary" type="button" id="back-btn">← 목록으로</button>
          <button class="secondary danger" type="button" id="delete-btn" style="margin-left: auto; background-color: #dc3545; color: white; border-color: #dc3545;">삭제</button>
        </div>
        <div class="status" id="board-status"></div>
        
        <article id="board-detail-card">
          <div class="board-detail-header" style="margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color);">
            <div>
              <h2 id="board-detail-title" style="margin: 0 0 8px 0; font-size: 24px;"></h2>
              <p id="board-detail-meta" style="margin: 0; color: var(--text-muted);"></p>
            </div>
            <div class="board-detail-views" style="margin-top: 16px;">
              조회수 <span id="board-detail-views">0</span>
            </div>
          </div>
          <div id="board-detail-body" style="min-height: 200px; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word;"></div>
        </article>
      </section>
    </main>

    <footer class="site-footer">
      © 국립강릉원주대학교 간호학과 – 학사행정 전용 도구</br>문의: codesensory@gmail.com
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="js/board-detail.js"></script>
</body>

</html>
