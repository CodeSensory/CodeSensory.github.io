<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>비밀번호 초기화 요청 - 간호학과 성적 관리</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>

<body>
  <div class="page-shell">
    <header class="site-header auth-header">
      <a href="login.html" id="logo-link" class="logo-link">
        <div class="logo">
          <img src="https://www.kangwon.ac.kr/assets/ko/images/logos/logo-color.webp" alt="강원대학교" />
          <span class="label-status campus" style="color:white;background:#F1B337" aria-label="원주">원주</span>
          <strong>간호학과 성적 관리</strong>
        </div>
      </a>
    </header>

    <section class="hero">
      <div class="hero-content">
        <h1 class="page-main-title">비밀번호 초기화 요청</h1>
        <p class="page-description">가입 시 사용한 이메일을 입력하세요.</p>
      </div>
    </section>

    <main class="content-grid">
      <section class="panel auth-panel">
        <form id="reset-request-form" class="auth-form">
          <label>
            이메일
            <input type="email" id="reset-email" name="email" required autocomplete="email" placeholder="example@email.com" />
          </label>
          <div class="auth-form-actions">
            <button type="submit" class="primary">요청하기</button>
          </div>
        </form>
        <div class="auth-links">
          <a href="login.html">로그인</a>
          <a href="signup.html">회원가입</a>
          <a href="reset-password.html">비밀번호 재설정</a>
        </div>
        <div class="status" id="reset-status"></div>
      </section>
    </main>

    <footer class="site-footer">
      © 강원대학교 간호학과 - 학사행정 전용 도구
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="config.js"></script>
  <script src="js/db-utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notify-request.js"></script>
  <script src="js/reset-request.js"></script>
</body>

</html>
