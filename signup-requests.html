<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>가입 요청 관리 - 간호학과 성적 관리</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>

<body>
  <div class="page-shell">
    <header class="site-header">
      <a href="view.html" id="logo-link" class="logo-link">
        <div class="logo">
          <img src="https://www.kangwon.ac.kr/assets/ko/images/logos/logo-color.webp" alt="강원대학교" />
          <span class="label-status campus" style="color:white;background:#F1B337" aria-label="원주">원주</span>
          <strong>간호학과 성적 관리</strong>
        </div>
      </a>
      <nav class="global-nav" data-current="signup-requests"></nav>
    </header>

    <section class="hero">
      <div class="hero-content">
        <h1 class="page-main-title">가입·비밀번호 초기화 요청 관리</h1>
        <p class="page-description">가입 요청 승인과 비밀번호 초기화 요청 내역을 확인할 수 있습니다.</p>
      </div>
    </section>

    <main class="content-grid">
      <section class="panel">
        <h2 style="font-size: 18px; margin-top: 0; margin-bottom: 16px;">가입 요청</h2>
        <div class="status" id="signup-requests-status"></div>
        <div class="table-container">
          <table id="signup-requests-table">
            <thead>
              <tr>
                <th>아이디</th>
                <th>이름</th>
                <th>직함</th>
                <th>요청일</th>
                <th style="width: 160px;">작업</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <p id="signup-requests-empty" class="empty-message" style="display: none; color: var(--text-muted); padding: 20px;">승인 대기 중인 가입 요청이 없습니다.</p>
      </section>

      <section class="panel" style="margin-top: 24px;">
        <h2 style="font-size: 18px; margin-top: 0; margin-bottom: 16px;">비밀번호 초기화 요청</h2>
        <div class="status" id="reset-requests-status"></div>
        <div class="table-container">
          <table id="reset-requests-table">
            <thead>
              <tr>
                <th>아이디</th>
                <th>이메일</th>
                <th>요청일</th>
                <th>승인여부</th>
                <th style="width: 160px;">작업</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <p id="reset-requests-empty" class="empty-message" style="display: none; color: var(--text-muted); padding: 20px;">비밀번호 초기화 요청이 없습니다.</p>
      </section>
    </main>

    <footer class="site-footer">
      © 강원대학교 간호학과 - 학사행정 전용 도구</br>문의: codesensory@gmail.com
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="config.js"></script>
  <script src="js/db-utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notify-request.js"></script>
  <script src="js/signup-requests.js"></script>
  <script src="js/nav.js"></script>
</body>

</html>
