<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>재시험 인원 조회</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.2/dist/umd/supabase.js"></script>
</head>

<body>
  <div class="page-shell">
    <header class="site-header">
      <a href="view.html" id="logo-link" class="logo-link">
        <div class="logo">
          <span>국립강릉원주대학교</span>
          <strong>간호학과 성적 관리</strong>
        </div>
      </a>
      <nav class="global-nav"></nav>
    </header>

    <section class="hero">
      <div class="hero-content">
        <p class="hero-kicker">RETAKE LIST</p>
        <h1>재시험 인원 조회</h1>
        <p>재시험을 진행한 학생의 성적·달성도 변화를 확인할 수 있습니다.</p>
      </div>
      <div class="hero-meta">
        <h3>표시 형식</h3>
        <ul>
          <li>이전 점수(이전 달성도) → 현재 점수(현재 달성도)</li>
          <li>예: 5(하) → 9(상)</li>
          <li>재시험이 없는 과목은 현재만 표시</li>
        </ul>
      </div>
    </section>

    <main class="content-grid">
      <section class="panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <h2 style="font-size: 18px; margin: 0;">재시험 학생 목록</h2>
          <label style="display: flex; align-items: center; gap: 8px;">
            레벨 선택:
            <select id="retake-list-level" name="level" style="width: 100px;">
              <option value="l1">L1</option>
              <option value="l2">L2</option>
              <option value="l3">L3</option>
            </select>
          </label>
        </div>
        <div class="status" id="retake-list-status"></div>
        <div class="table-container" style="max-height: 60vh;">
          <table id="retake-list-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      © 국립강릉원주대학교 간호학과 – 학사행정 전용 도구</br>문의: codesensory@gmail.com
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/retake-list.js"></script>
  <script src="js/nav.js"></script>
</body>

</html>
