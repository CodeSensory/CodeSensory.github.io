<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>가입 요청 관리 - 간호학과 성적 관리</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.2/dist/umd/supabase.js"></script>
</head>

<body>
  <div class="page-shell">
    <header class="site-header">
      <a href="view.html" id="logo-link" class="logo-link">
        <div class="logo">
          <span>국립강릉원주대학교</span>
          <strong>간호학과 성적 관리</strong>
        </div>
      </a>
      <nav class="global-nav" data-current="signup-requests"></nav>
    </header>

    <section class="hero">
      <div class="hero-content">
        <p class="hero-kicker">REQUESTS</p>
        <h1>가입·비밀번호 초기화 요청 관리</h1>
        <p>가입 요청 승인과 비밀번호 초기화 요청 내역을 확인할 수 있습니다.</p>
      </div>
    </section>

    <main class="content-grid">
      <section class="panel">
        <h2 style="font-size: 18px; margin-top: 0; margin-bottom: 16px;">가입 요청</h2>
        <div class="status" id="signup-requests-status"></div>
        <div class="table-container">
          <table id="signup-requests-table">
            <thead>
              <tr>
                <th>아이디</th>
                <th>이름</th>
                <th>직함</th>
                <th>요청일</th>
                <th style="width: 160px;">작업</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <p id="signup-requests-empty" class="empty-message" style="display: none; color: var(--text-muted); padding: 20px;">승인 대기 중인 가입 요청이 없습니다.</p>
      </section>

      <section class="panel" style="margin-top: 24px;">
        <h2 style="font-size: 18px; margin-top: 0; margin-bottom: 16px;">비밀번호 초기화 요청</h2>
        <div class="status" id="reset-requests-status"></div>
        <div class="table-container">
          <table id="reset-requests-table">
            <thead>
              <tr>
                <th>아이디</th>
                <th>이메일</th>
                <th>요청일</th>
                <th>승인여부</th>
                <th style="width: 160px;">작업</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <p id="reset-requests-empty" class="empty-message" style="display: none; color: var(--text-muted); padding: 20px;">비밀번호 초기화 요청이 없습니다.</p>
      </section>
    </main>

    <footer class="site-footer">
      © 국립강릉원주대학교 간호학과 – 학사행정 전용 도구</br>문의: codesensory@gmail.com
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/signup-requests.js"></script>
  <script src="js/nav.js"></script>
</body>

</html>
