<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

    <header class="site-header">
      <a href="index.html" class="logo-link">

          <img src="https://www.kangwon.ac.kr/assets/ko/images/logos/logo-color.webp" alt="강원대학교" />
          <span class="label-status campus" style="color:white;background:#F1B337" aria-label="원주">원주</span>
          <strong>간호학과 실습 배치</strong>
        </div>

    </header>

    <section class="hero">

    <main class="content-grid">

            <a href="https://github.com/CodeSensory/CodeSensory.github.io/releases/download/v1.0.0/wonju_batch.exe" download="wonju_batch.exe" class="btn">배치 프로그램 다운로드</a>
