<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>커뮤니티 게시판</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.2/dist/umd/supabase.js"></script>
</head>

<body>
  <div class="page-shell">
    <header class="site-header">
      <div class="logo">
        <span>국립강릉원주대학교</span>
        <strong>간호학과 성적 관리</strong>
      </div>
      <nav class="global-nav">
        <a href="input.html">성적 입력/관리</a>
        <a href="view.html">성적 조회</a>
        <a href="summary.html">성적 요약</a>
        <a href="manage.html">관리 필요</a>
        <a class="is-active" href="board.html">게시판</a>
      </nav>
    </header>

    <section class="hero">
      <div class="hero-content">
        <p class="hero-kicker">COMMUNITY BOARD</p>
        <h1>공지 및 안내</h1>
        <p>프로그램 사용 방법과 공지사항을 게시할 수 있습니다.</p>
      </div>
      <div class="hero-meta">
        <h3>게시판 이용 안내</h3>
        <ul>
          <li>게시글 등록/조회/삭제</li>
          <li>제목 또는 작성자 검색</li>
          <li>실시간 조회수 반영</li>
        </ul>
      </div>
    </section>

    <main class="content-grid">
      <section class="panel">
        <div class="board-header">
          <div>
            <h2>커뮤니티 공지사항</h2>
            <p class="board-description">학과 공지 및 안내를 최신순으로 확인하세요.</p>
          </div>
          <div class="board-meta-pill">
            총 <span id="board-total-count">0</span>건
          </div>
        </div>

        <div class="toolbar board-toolbar" style="margin-bottom: 16px;">
          <input type="text" id="board-search-input" placeholder="제목 또는 작성자를 입력하세요" />
          <button class="primary" type="button" id="board-search-btn">검색</button>
          <button class="secondary" type="button" id="board-refresh-btn">새로고침</button>
          <button class="primary" type="button" id="board-write-btn" style="margin-left: auto;">새 글 작성</button>
        </div>
        <div class="status" id="board-status"></div>
        <div class="table-container board-table-container">
          <table id="board-table">
            <thead>
              <tr>
                <th style="width: 60px;">번호</th>
                <th>제목</th>
                <th style="width: 120px;">작성자</th>
                <th style="width: 140px;">작성일</th>
                <th style="width: 80px;">조회수</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="board-pagination">
          <button class="secondary" type="button" id="board-prev-page">&lt;</button>
          <span id="board-pagination-info">1 / 1</span>
          <button class="secondary" type="button" id="board-next-page">&gt;</button>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      © 국립강릉원주대학교 간호학과 – 학사행정 전용 도구</br>문의: codesensory@gmail.com
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="js/board.js"></script>
</body>

</html>
